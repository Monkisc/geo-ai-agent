<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Geo AI Agent</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial;
        }

        body{
            display:flex;
            height:100vh;
            overflow:hidden;
        }

        #sidebar{

            width:400px;
            background:#ffffff;
            border-right:1px solid #ddd;
            overflow-y:auto;
            padding:20px;
        }

        #map{
            flex:1;
            height:100%;
        }

        .search-box{
            display:flex;
            gap:10px;
            margin-bottom:20px;
        }

        .search-box input{

            flex:1;
            padding:12px;
            border-radius:10px;
            border:1px solid #ccc;
            font-size:16px;
        }

        .search-box button{

            padding:12px 18px;
            border:none;
            background:#4285F4;
            color:white;
            border-radius:10px;
            cursor:pointer;
            font-weight:bold;
        }

        .place-card{

            background:#f9f9f9;
            padding:15px;
            border-radius:14px;
            margin-bottom:15px;
            cursor:pointer;
            transition:0.2s;
            border:1px solid #eee;
        }

        .place-card:hover{
            transform:scale(1.02);
        }

        .place-card h3{
            margin-bottom:10px;
            color:#222;
        }

        .place-card p{
            margin-bottom:8px;
            font-size:14px;
        }

        .loading,
        .error,
        .no-results{

            padding:20px;
            text-align:center;
            font-weight:bold;
        }

        a{
            color:#4285F4;
            text-decoration:none;
        }

        #downloadBtn{
            width:100%;
            margin-bottom:15px;
            padding:12px;
            border:none;
            background:#34A853;
            color:white;
            border-radius:10px;
            cursor:pointer;
            font-weight:bold;
        }

        #loadMoreBtn{
            width:100%;
            margin-top:15px;
            padding:12px;
            border:none;
            background:#4285F4;
            color:white;
            border-radius:10px;
            cursor:pointer;
            font-weight:bold;
            display:none;
        }

    </style>

</head>

<body>

    <div id="sidebar">

        <div class="search-box">

            <input
                type="text"
                id="searchInput"
                placeholder="Buscar colegios, restaurantes..."
            />

            <button onclick="searchPlaces()">
                Buscar
            </button>

        </div>

        <button id="downloadBtn" onclick="downloadCSV()">
            Descargar CSV
        </button>

        <div id="results"></div>

        <button
            id="loadMoreBtn"
            onclick="loadMorePlaces()"
        >
            Cargar más
        </button>

    </div>

    <div id="map"></div>

    <script src="app.js"></script>

    <script
        async
        defer
        src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAsUyVuTHPgQ-8OR8DvYLyGbbxDkkiShP8&callback=initMap">
    </script>

</body>

</html>
