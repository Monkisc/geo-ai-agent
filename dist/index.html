<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geo AI Lead Agent</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="search-panel">
    <input type="text" id="queryInput" placeholder="¿Qué buscas? (ej: colegios)">
    <input type="text" id="locationInput" placeholder="¿Dónde? (ej: Bogotá, Colombia)">
    <button onclick="searchPlaces()">Buscar</button>
    <button id="downloadBtn" onclick="downloadCSV()">Descargar CSV</button>
</div>


    <div class="main-container">
        
        <div id="results-section">
        
            <div id="results">
                <p class="placeholder-text">Escribe tu búsqueda arriba para rastrear leads y correos reales...</p>
            </div>
            
            <button id="loadMoreBtn" onclick="loadMorePlaces()" class="hidden-btn">
                Cargar más resultados
            </button>
        </div>

        <div id="map"></div>

    </div>

    <script src="app.js"></script>
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAsUyVuTHPgQ-8OR8DvYLyGbbxDkkiShP8&callback=initMap&loading=async" defer></script>
</body>
</html>
